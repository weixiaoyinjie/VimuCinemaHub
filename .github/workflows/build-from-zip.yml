
name: Build Vimu Cinema Hub 2.1 from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'VimuCinemaHub_v2_1_Fixed_Source.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -euo pipefail
          test -s VimuCinemaHub_v2_1_Fixed_Source.zip
          unzip -q -o VimuCinemaHub_v2_1_Fixed_Source.zip -d .
          test -s tvbridge/build.gradle
          test -s mobile/build.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Google TV and Fold6 APK
        run: gradle :tvbridge:assembleDebug :mobile:assembleDebug --no-daemon --stacktrace

      - name: Upload Google TV bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: VimuCinema_2_1_GoogleTV_APK
          path: tvbridge/build/outputs/apk/debug/tvbridge-debug.apk
          if-no-files-found: error

      - name: Upload Fold6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VimuCinema_2_1_Fold6_APK
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
