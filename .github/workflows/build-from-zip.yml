
name: Build Vimu Cinema Hub v2 (SDK Fix)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o VimuCinemaHub_v2_Source.zip -d .
          test -f settings.gradle
          test -f mobile/src/main/assets/cinema.html
          test -f tvbridge/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile TV bridge and Fold6 APK
        run: gradle :tvbridge:assembleDebug :mobile:assembleDebug --no-daemon --stacktrace

      - name: Upload Google TV bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: VimuCinemaHub_v2_GoogleTV_Bridge_APK
          path: tvbridge/build/outputs/apk/debug/tvbridge-debug.apk
          if-no-files-found: error

      - name: Upload Fold6 APK
        uses: actions/upload-artifact@v4
        with:
          name: VimuCinemaHub_v2_Fold6_APK
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
